<script>
/* RANKARA çevrimdışı çalışma katmanı: kayıtlar yalnız bu cihazda (IndexedDB) tutulur, hiçbir sunucuya gönderilmez */
(function () {
  const DBN = 'rankara', ST = 'kv'; let dbp = null;
  const idb = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => r.result.createObjectStore(ST); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const run = async (mode, fn) => { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction(ST, mode); const q = fn(t.objectStore(ST)); t.oncomplete = () => res(q ? q.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  const doc = (p) => ({ id: p.split('/').pop(), path: p,
    get: async () => { const v = await run('readonly', (s) => s.get(p)); return { id: p.split('/').pop(), exists: v !== undefined, data: () => v }; },
    set: async (o) => { await run('readwrite', (s) => s.put(JSON.parse(JSON.stringify(o)), p)); },

const IE_SEX = (ctx) => (ctx && ctx.p && ctx.p.sex === 'K' ? 'K' : 'E');

const recsOf = (p, ck) => ((p.mod && p.mod[ck] && p.mod[ck].recs) || []).slice().sort((a, b) => (a.d.tarih || '').localeCompare(b.d.tarih || '') || (a.c || 0) - (b.c || 0));

function ctxOf(p, ck, rec) {
  const all = recsOf(p, ck).filter((r) => r.id !== rec.id);
  const before = all.filter((r) => (r.d.tarih || '') <= (rec.d.tarih || ''));
  const prev = before.filter((r) => r.f === rec.f).slice(-1)[0] || null;
  const first = all.find((r) => r.f === 'ilk') || null;
  const every = allRecsOf(p).filter((r) => r.id !== rec.id && (r.d.tarih || '') <= (rec.d.tarih || '9999'));
  return { p, ck, rec, d: rec.d, prev, first, allRecs: [...every, rec], age: ageOf(p) };
}

  if (!rec) return [];
  const d = rec.d; const out = [];
  if (redAlerts(ctxOf(p, ck, rec)).length) out.push(['bad', 'Hekim uyarısı']);
  if (d.sym && Object.values(d.sym).some((x) => x === true)) out.push(['bad', 'Yakınma']);
  if (d.ek1 && Object.values(d.ek1).some((x) => x === true)) out.push(['warn', 'EK-1 pozitif']);
  if ((d.refs || []).length) out.push(['warn', 'Yönlendirme']);
  const ctx = ctxOf(p, ck, rec);
  const f = formOf(ck, rec.f); if (f) for (const st of f.steps) for (const fl of st.f.flatMap((x) => x.t === 'view' ? x.f : [x])) if (fl.t === 'calc') { const r = fl.fn(ctx); if (r && r.l === 'bad') out.push(['bad', fl.label]); }

}
function suggestedScales(ctx) {
  const s = new Set(); const p = ctx.p, d = ctx.d; const prevs = (ctx.allRecs || []).filter((r) => r.id !== ctx.rec.id);
  const yearAgo = new Date(); yearAgo.setFullYear(yearAgo.getFullYear() - 1); const iso = yearAgo.toISOString().slice(0, 10);
  const had = (k) => prevs.some((r) => r.d.sc && r.d.sc[k] != null && (r.d.tarih || '') >= iso);
  ['APSQ', 'ASSQ', 'MEDAS'].forEach((k) => { if (!had(k)) s.add(k); });
  const sc = d.sc || {};
  if (sc.APSQ != null && sc.APSQ >= 17) ['PHQ9', 'GAD7', 'SCOFF', 'AUDITC'].forEach((k) => s.add(k));
  if ((ctx.age || 0) >= 35) s.add('STOPBANG');
  const duzey = ctx.first && ctx.first.d.duzey;
  if (p.sex === 'K' && isEnd(ctx.first ? ctx.first.d : {}) && !had('LEAFQ')) s.add('LEAFQ');
  if (sc.LEAFQ != null && sc.LEAFQ >= 8) s.add('SCOFF');
  if (['Sigara', 'Elektronik sigara', 'Nargile'].includes(d.nikotin)) s.add('FAG');
  if (d.alkol && d.alkol !== 'Hiç') s.add('AUDITC');
  if (duzey === 'Sporcu değil') s.add('IPAQ');

function numCatalog() { const m = {}; for (const c of CLINICS) for (const f of c.forms) for (const st of f.steps) for (const x of st.f) if (x.t === 'num' && !m[x.k]) m[x.k] = { ad: x.label.replace(/ \(.*\)$/, ''), unit: x.unit }; m.egfr = { ad: 'eGFR', unit: 'mL/dk/1,73 m²' }; m.yuk = { ad: 'Haftalık antrenman yükü', unit: 'AU' }; m.iyilik = { ad: 'İyilik hali toplamı', unit: '/ 35' }; m.crcl = { ad: 'Kreatinin klirensi', unit: 'mL/dk' }; return m; }

  const W = 900, H = 380, L = 64, Rr = 24, T = 36, B = 64; const vs = ser.map((x) => x.v); let mn = Math.min(...vs), mx = Math.max(...vs); if (mn === mx) { mn -= 1; mx += 1; } const pad = (mx - mn) * 0.12; mn -= pad; mx += pad;
  const ts = ser.map((x) => Date.parse(x.date)); const t0 = Math.min(...ts), t1 = Math.max(...ts); const X = (t) => t1 === t0 ? (L + W - Rr) / 2 : L + (W - L - Rr) * (t - t0) / (t1 - t0); const Y = (v) => T + (H - T - B) * (1 - (v - mn) / (mx - mn));

async function pinOk() {
  if (S.busy) return; S.busy = true; S.err = ''; render();
  try {
    if (S.view === 'setup') {
      if (S.pin1 == null) { S.pin1 = S.pin; S.pin = ''; S.busy = false; render(); return; }
      if (S.pin !== S.pin1) { S.err = 'PIN\'ler aynı değil, baştan girin.'; S.pin1 = null; S.pin = ''; S.busy = false; render(); return; }
      const salt = b64(crypto.getRandomValues(new Uint8Array(16))); S.key = await deriveKey(S.pin, salt, ITER);
      S.meta = { salt, iter: ITER, check: await seal(S.key, { ok: 'SPORIUM', created: Date.now() }), v: 1 }; await S.db.doc(P_('vault')).set(S.meta);
      try { await obKeyCreate(); } catch (e) { /* anahtar sonraki açılışta yeniden denenir */ }
      S.pin = ''; S.pin1 = null; S.busy = false; armLock(); go('home'); toast('PIN kaydedildi');
    } else {
      const key = await deriveKey(S.pin, S.meta.salt, S.meta.iter || ITER);
      try { await unseal(key, S.meta.check); } catch (e) { S.fails++; S.pin = ''; S.busy = false; S.err = S.fails >= 5 ? 'Çok sayıda hatalı deneme. 30 saniye bekleyin.' : 'PIN hatalı.'; if (S.fails >= 5) { S.busy = true; setTimeout(() => { S.busy = false; S.fails = 0; S.err = ''; render(); }, 30000); } render(); return; }
      S.key = key; S.fails = 0; S.pin = ''; await loadAll(); try { await migrateNos(); } catch (e) { } try { await migrateIE(); } catch (e) { } S.busy = false; armLock(); go('home');
    }
  } catch (e) { S.busy = false; S.err = 'İşlem tamamlanamadı. Bağlantıyı kontrol edip tekrar deneyin.'; render(); }
}

    case 'docx': await saveDOCX(); break;
    case 'ozetdocx': await saveSummaryDOCX(); break;
    case 'wipe': confirmBox('Bu iPad’deki TÜM hasta kayıtları, formlar ve fotoğraflar kalıcı olarak silinsin mi? Dosya numaraları 0001’den yeniden başlar. PIN ve ön anket bağlantısı değişmez. Bu işlem geri alınamaz; saklamak istediğiniz kayıt varsa önce yedek alın.', 'Hepsini sil', async () => { try { const snap = await S.db.collection(`data/users/${S.uid}`).get(); for (const d of snap.docs) { if (d.id.startsWith('p_') || d.id.startsWith('f_') || d.id === 'seq' || d.id === 'stats') await S.db.doc(P_(d.id)).delete(); } await loadAll(); toast('Tüm kayıtlar silindi'); go('home'); } catch (e) { toast('Silme tamamlanamadı'); } }); break;
    case 'csv': await doCSV(); break;
    case 'q': S.q = (S.q + v).slice(0, 4); render(); break;
    case 'qdel': S.q = S.q.slice(0, -1); render(); break;
    case 'qclr': S.q = ''; S.qp = ''; render(); break;
    case 'qp': S.qp = S.qp === v ? '' : v; render(); break;
    case 'labocr': $('#labCam').value = ''; $('#labCam').click(); break;
    case 'data': S.dk = v || 'all'; go('data'); break;
    case 'dk': S.dk = v; render(); break;
    case 'xlsx': await doXLSX(v); break;
    case 'clinic': S.clinic = v; go('clinic'); break;
    case 'grp': S.grp = v; go('grp'); break;
    case 'newp': S.np = { clinics: [S.clinic] }; go('newp'); break;
    case 'cancelnp': go(S.np && S.np.id ? 'patient' : 'clinic'); break;
    case 'editp': { const p = S.pts.get(S.cur); S.np = { id: p.id, rankara: p.rankara, by: p.by, sex: p.sex, clinics: [...(p.clinics || [])], riza: p.riza, kimRiza: p.kimRiza, kim: { ...(p.kim || {}) }, dec: Math.floor(p.by / 10) * 10 }; go('newp'); break; }
    case 'npno': S.np.no = ((S.np.no || '') + v).slice(0, 12); render(); break;
    case 'npdel': S.np.no = (S.np.no || '').slice(0, -1); render(); break;
    case 'npclr': S.np.no = ''; render(); break;
    case 'npdec': S.np.dec = +v; render(); break;
    case 'npby': S.np.by = +v; render(); break;
    case 'npsex': S.np.sex = v; render(); break;
    case 'nprz': S.np.riza = v; render(); break;
    case 'nprk': S.np.rankara = v; render(); break;
    case 'npmode': S.np.mode = v; S.np.link = null; render(); break;
    case 'nplp': S.np.lp = S.np.lp === v ? '' : v; S.np.link = null; render(); break;
    case 'nplq': S.np.lq = ((S.np.lq || '') + v).slice(0, 4); S.np.link = null; render(); break;
    case 'nplqdel': S.np.lq = (S.np.lq || '').slice(0, -1); render(); break;
    case 'nplqclr': S.np.lq = ''; S.np.lp = ''; S.np.link = null; render(); break;
    case 'nplink': S.np.link = v; render(); break;
    case 'npkr': S.np.kimRiza = v; S.np.kim = S.np.kim || {}; render(); break;
    case 'idrep': S.idInReport = !S.idInReport; render(); break;
    case 'npcl': { const s = new Set(S.np.clinics || []); s.has(v) ? s.delete(v) : s.add(v); S.np.clinics = [...s]; render(); break; }
    case 'npsave': {
      const n = S.np; let p;
      if (n.mode === 'link' && !n.id) { const src = S.pts.get(n.link); if (!src) return; p = JSON.parse(JSON.stringify(src)); p.clinics = [...new Set([...(p.clinics || []), S.clinic])]; }
      else if (n.id) { p = { ...JSON.parse(JSON.stringify(S.pts.get(n.id))), by: n.by, sex: n.sex, clinics: n.clinics, riza: n.riza }; if (n.kimRiza !== p.kimRiza && n.kimRiza === 'Alındı') p.kimRizaTarih = todayISO(); p.kimRiza = n.kimRiza; p.kim = n.kim; }
      else p = { id: 'p_' + rnd(), by: n.by, sex: n.sex, clinics: n.clinics, riza: n.riza, rizaTarih: n.riza === 'Alındı' ? todayISO() : null, kimRiza: n.kimRiza, kim: n.kim, kimRizaTarih: n.kimRiza === 'Alındı' ? todayISO() : null, created: Date.now(), mod: {}, fno: {} };
      if (n.rankara) { if (p.rankara !== n.rankara) p.rankaraTarih = todayISO(); p.rankara = n.rankara; }
      if (p.kimRiza !== 'Alındı') delete p.kim; else { p.kim = Object.fromEntries(Object.entries(p.kim || {}).map(([a, c]) => [a, String(c).trim()]).filter(([, c]) => c)); }
      if (!p.clinics.includes(S.clinic)) p.clinics.push(S.clinic);
      try { b.disabled = true; await assignNos(p); await saveP(p); S.cur = p.id; toast(`Hasta kaydedildi · ${fileNo(p, S.clinic)}`); go('patient'); } catch (err) { toast('Kaydedilemedi, bağlantıyı kontrol edin'); b.disabled = false; }
      break; }
    case 'openp': S.cur = v; if (b.dataset.c) S.clinic = b.dataset.c; else { const p = S.pts.get(v); S.clinic = (p.clinics || [])[0]; } go('patient'); break;
    case 'photo': { const p = S.pts.get(S.cur); if (p.riza !== 'Alındı') { toast('Önce açık rızayı kaydedin'); return; } $('#camInput').value = ''; $('#camInput').click(); break; }
    case 'delp': confirmBox('Hasta bu poliklinikten çıkarılsın mı? Bu polikliniğe ait kayıtları da silinir. Başka poliklinikte kaydı varsa orada kalır.', 'Çıkar', async () => {
      const p = JSON.parse(JSON.stringify(S.pts.get(S.cur))); p.clinics = (p.clinics || []).filter((x) => x !== S.clinic); if (p.mod) delete p.mod[S.clinic];
      if (!p.clinics.length) { await S.db.doc(P_(p.id)).delete(); await S.db.doc(P_('f_' + p.id)).delete(); S.pts.delete(p.id); S.photos.delete(p.id); } else await saveP(p);
      toast('Hasta çıkarıldı'); go('clinic'); }); break;
    case 'newrec': { const rec = { id: 'r_' + rnd(6), f: v, c: Date.now(), d: { tarih: todayISO() } }; const prev = allRecsOf(S.pts.get(S.cur)).filter((r) => r.d.kilac).slice(-1)[0]; if (prev && formOf(S.clinic, v).steps.some((st) => st.f.some((x) => x.k === 'kilac'))) rec.d.kilac = [...prev.d.kilac]; if (S.clinic === 'spor') obPrefill(S.pts.get(S.cur), v, rec); openWizard(rec); break; }
    case 'openrec': S.rv = v; go('report'); break;
    case 'trend': S.tk = v; go('trend'); break;
    case 'backp': go('patient'); break;
    case 'editrec': { const p = S.pts.get(S.cur); const rec = JSON.parse(JSON.stringify(recsOf(p, S.clinic).find((r) => r.id === S.rv))); openWizard(rec, 0, true); break; }
    case 'delrec': confirmBox('Bu kayıt kalıcı olarak silinsin mi?', 'Sil', async () => { const p = JSON.parse(JSON.stringify(S.pts.get(S.cur))); p.mod[S.clinic].recs = p.mod[S.clinic].recs.filter((r) => r.id !== S.rv); await saveP(p); toast('Kayıt silindi'); go('patient'); }); break;
    case 'phrep': S.photoInReport = !S.photoInReport; render(); break;
    // form alanları
    case 'fs': D[k] = D[k] === v ? null : v; render(); break;
    case 'fm': { const f = fieldByKey(k); let arr = new Set(D[k] || []); if (f.none && v === f.none) arr = arr.has(v) ? new Set() : new Set([v]); else { arr.has(v) ? arr.delete(v) : arr.add(v); if (f.none) arr.delete(f.none); } D[k] = [...arr]; render(); break; }
    case 'fy': D[k] = D[k] || {}; D[k][b.dataset.i] = v === '1'; render(); break;
    case 'fc': D[k] = D[k] || {}; D[k][b.dataset.i] = !(D[k][b.dataset.i] === true); render(); break;
    case 'fyall': { const f = fieldByKey(k); D[k] = Object.fromEntries(f.items.map(([ik]) => [ik, false])); render(); break; }
    case 'fl': D[k] = D[k] || {}; D[k][b.dataset.i] = +v; render(); break;
    case 'fn': { const f = fieldByKey(k); const ctx = ctxOf(S.pts.get(S.cur), S.clinic, S.wiz.rec); const base = isNum(D[k]) ? D[k] : startOf(f, ctx); const nv = clamp(base + (+v), f.min, f.max); D[k] = f.dec === 2 ? Math.round(nv * 100) / 100 : f.dec ? Math.round(nv * 10) / 10 : Math.round(nv); render(); break; }
    case 'fnset': { const f = fieldByKey(k); const ctx = ctxOf(S.pts.get(S.cur), S.clinic, S.wiz.rec); D[k] = startOf(f, ctx); render(); break; }
    case 'fnclr': D[k] = null; render(); break;
    case 'fdt': D[k] = todayISO(); render(); break;
    case 'fdclr': D[k] = null; render(); break;
    case 'sctog': { D.sc = D.sc || {}; const s = SC[v]; if (D.sc[v] != null) { delete D.sc[v]; if (v === 'STOPBANG') D.sbi = []; }
      else if (v === 'STOPBANG') { const p = S.pts.get(S.cur); const pre = []; if ((ageOf(p) || 0) > 50) pre.push(5); if (p.sex === 'E') pre.push(7); D.sbi = pre; D.sc.STOPBANG = pre.length; }
      else D.sc[v] = s.choices ? s.choices[0] : s.start; render(); break; }
    case 'sbi': { const set = new Set(D.sbi || []); const i = +v; set.has(i) ? set.delete(i) : set.add(i); D.sbi = [...set]; D.sc.STOPBANG = set.size; render(); break; }
    case 'scch': D.sc[k] = v; render(); break;
    case 'scn': { const s = SC[k]; D.sc[k] = clamp((D.sc[k] ?? s.start) + (+v), s.min, s.max); render(); break; }
    case 'item9': D.scx = D.scx || {}; D.scx.PHQ9 = { item9: v === '1' }; render(); break;
    case 'segskip': case 'segundo': { D.skip = D.skip || {}; if (a === 'segskip') D.skip[v] = true; else delete D.skip[v];
      if (a === 'segskip') { const f = formOf(S.clinic, S.wiz.rec.f); const ctx = ctxOf(S.pts.get(S.cur), S.clinic, S.wiz.rec); S.wiz.step++; while (S.wiz.step < f.steps.length && f.steps[S.wiz.step].when && !f.steps[S.wiz.step].when(D, ctx)) S.wiz.step++; window.scrollTo(0, 0); }
      render(); break; }
    case 'wizback': if (S.wiz.step > 0) { const f = formOf(S.clinic, S.wiz.rec.f); const ctx = ctxOf(S.pts.get(S.cur), S.clinic, S.wiz.rec); S.wiz.step--; while (S.wiz.step > 0 && f.steps[S.wiz.step].when && !f.steps[S.wiz.step].when(D, ctx)) S.wiz.step--; window.scrollTo(0, 0); render(); } break;
    case 'wiznext': {
      const f = formOf(S.clinic, S.wiz.rec.f); { const st0 = f.steps[S.wiz.step]; const g = st0 && st0.gate ? st0.gate(D, ctxOf(S.pts.get(S.cur), S.clinic, S.wiz.rec)) : null; if (g) { toast(g.t); return; } } S.wiz.step++; { const ctx = ctxOf(S.pts.get(S.cur), S.clinic, S.wiz.rec); while (S.wiz.step < f.steps.length && f.steps[S.wiz.step].when && !f.steps[S.wiz.step].when(D, ctx)) S.wiz.step++; }
      const st = f.steps[S.wiz.step]; if (st && st.f.some((x) => x.autoRefs)) { const ctx = ctxOf(S.pts.get(S.cur), S.clinic, S.wiz.rec); D.refs = [...new Set([...(D.refs || []), ...autoRefs(ctx)])]; }
      window.scrollTo(0, 0); render(); break; }
    case 'wizcancel': confirmBox('Kaydedilmemiş bilgiler silinecek. Çıkılsın mı?', 'Çık', async () => { S.wiz = null; go('patient'); }); break;
    case 'wizsave': await wizSave(); break;
    case 'obopen': S.obx = null; obBox(obPickHTML()); break;
    case 'obfile': $('#obFile').click(); break;
    case 'obpaste': { const t = ($('#obTxt') || {}).value || ''; if (!t.trim()) { toast('Önce kodu yapıştırın'); break; } await obProcess(t); break; }
    case 'obclose': S.obx = null; obBox(''); break;
    case 'obsave': await obSave(); break;
    case 'obgo': obBox(''); S.obx = null; S.cur = v; go('patient'); break;
    case 'obdel': confirmBox('Hastanın ön anketi silinsin mi? Kayda aktarılmış yanıtlar etkilenmez.', 'Sil', async () => { const p = S.pts.get(S.cur); const copy = JSON.parse(JSON.stringify(p)); delete copy.ob; try { await saveP(copy); toast('Ön anket silindi'); render(); } catch (e) { toast('Silinemedi'); } }); break;
    case 'oblink': try { await navigator.clipboard.writeText(obLink()); toast('Bağlantı kopyalandı'); } catch (e) { toast('Kopyalanamadı; bağlantıyı ekrandan seçip kopyalayın'); } break;
    case 'obshare': try { await navigator.share({ url: obLink(), title: 'RANKARA ön anket' }); } catch (e) { if (!e || e.name !== 'AbortError') toast('Paylaşılamadı; “Bağlantıyı kopyala”yı kullanın'); } break;
    case 'wizdone': if (!S.wiz.saved) { const ok = await wizSave(); if (!ok) return; } S.wiz = null; go('patient'); break;
    case 'pdf': await makePDF(); break;
  }
});
document.addEventListener('input', (e) => { const k = e.target.dataset && e.target.dataset.tk; if (k && S.wiz) S.wiz.rec.d[k] = e.target.value; const nk = e.target.dataset && e.target.dataset.npk; if (nk && S.np) { S.np.kim = S.np.kim || {}; S.np.kim[nk] = e.target.value.slice(0, 300); } });
document.addEventListener('change', async (e) => {
  const dk = e.target.dataset && e.target.dataset.dk; if (dk && S.wiz) { S.wiz.rec.d[dk] = e.target.value || null; render(); }
  if (e.target.id === 'camInput' && e.target.files[0]) await handlePhoto(e.target.files[0]);
  if (e.target.id === 'labCam' && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ''; await runLabOCR(f); }
  if (e.target.id === 'restoreFile' && e.target.files[0]) await doRestore(e.target.files[0]);
  if (e.target.id === 'obFile' && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ''; if (f.size > 600000) { obBox(obPickHTML('Dosya çok büyük; bir ön anket dosyası değil.')); } else await obProcess(await f.text()); }
  if (e.target.id === 'obOk') { const b = $('#obSaveBtn'); if (b) b.disabled = !e.target.checked; }
});

boot();
</script>
