<style>

  ] },

    { t: 'text', k: 'kalpnot', l: 'Evet dediyseniz kısaca anlatın (ne zaman, ne kadar sürdü, hâlâ oluyor mu?)' }
  ] },
  { id: 'oz', ad: 'Özgeçmiş ve aile öyküsü', ne: 'Geçmiş hastalıklarınız ve ailenizdeki kalp hastalıkları, risk değerlendirmesinin temelidir.', q: [
    { t: 'multi', k: 'oz', l: 'Sizde hiç oldu mu ya da var mı?', o: ['Kalp hastalığı', 'Miyokardit / viral enfeksiyon', 'Hipertansiyon', 'Diyabet', 'Kronik böbrek hastalığı', 'Astım', 'Tiroid hastalığı', 'Kalp girişimi / cerrahi'], none: 'Yok', help: 'Miyokardit: kalp kasının virüs gibi bir nedenle iltihaplanması.' },
    { t: 'single', k: 'nikotin', l: 'Sigara / nikotin', o: ['Hiç', 'Bırakmış', 'Sigara', 'Elektronik sigara', 'Nargile'] },
    { t: 'multi', k: 'aile', l: 'Ailenizde (anne, baba, kardeş, çocuk, amca, hala, dayı, teyze, büyükanne ve büyükbaba) şunlardan biri oldu mu?', o: ['<35 yaş ani ölüm', 'HKMP', 'DKMP', 'ARVK', 'Uzun QT / Brugada / KPVT', 'Marfan / aortopati', 'Erken koroner hastalık', '<35 yaş pil / ICD'], none: 'Yok', extra: 'Bilmiyorum',
      help: '35 yaşından önce ani ve beklenmedik ölüm; HKMP: kalın kalp kası hastalığı; DKMP: genişlemiş kalp kası hastalığı; ARVK: sağ karıncık kas hastalığı; Uzun QT / Brugada / KPVT: kalıtsal ritim hastalıkları; Marfan / aortopati: ana damar genişlemesi; Erken koroner hastalık: erkekte 55, kadında 65 yaşından önce kalp krizi ya da damar hastalığı.' }
  ] },
  { id: 'ilac', ad: 'İlaçlar ve takviyeler', ne: 'Bazı ilaç ve takviyeler kalp ritmini, tansiyonu ve EKG’yi etkiler. Cevabınız yalnızca kalp güvenliğiniz için kullanılır.', q: [
    { t: 'multi', k: 'ilacsin', l: 'Düzenli ya da sık kullandığınız ilaçlar', o: ['Tansiyon ilacı', 'Kolesterol ilacı', 'Astım / alerji ilacı ya da spreyi', 'Dikkat eksikliği (DEHB) ilacı', 'Ağrı kesici / iltihap giderici (reçetesiz dahil)', 'Burun açıcı / grip ilacı', 'Hormon / doğum kontrol', 'Antidepresan / uyku ilacı', 'Kan sulandırıcı', 'Diğer'], none: 'Hiçbiri', neg: true },
    { t: 'text', k: 'ilacnot', l: 'İlaç adlarını bilirseniz yazın (isteğe bağlı)' },
    { t: 'multi', k: 'takviye', l: 'Takviyeler', o: ['Protein', 'Kreatin', 'Vitamin / mineral', 'Kilo verme ürünü', 'Kafein / pre-workout'], none: 'Kullanmıyor', neg: true },
    { t: 'single', k: 'caf', l: 'Günde kaç fincan kahve ya da çay içiyorsunuz?', o: ['0', '1', '2', '3', '4', '5', '6+'] },
    { t: 'single', k: 'enerji', l: 'Enerji içeceği', o: ['Hiç', 'Haftada 1–3', 'Hemen her gün'] },
    { t: 'single', k: 'alkol', l: 'Alkol', o: ['Hiç', 'Ayda birkaç kez', 'Haftada 1–2', 'Haftada 3 ve üzeri'], neg: true },
    { t: 'single', k: 'ped', l: 'Performans artırıcı madde (anabolik steroid, büyüme hormonu, uyarıcı gibi) kullandınız mı?', o: ['Hayır', 'Evet'], neg: true,
      help: 'Bu bilgi yalnızca kalp güvenliğiniz içindir. Siz yazılı izin vermedikçe kulübünüzle, antrenörünüzle ya da federasyonla paylaşılmaz.' }
  ] },
  { id: 'diyet', ad: 'Beslenme', ne: 'Yetersiz enerji alımı kalp ritmini ve kemik sağlığını etkileyebilir; beslenme alışkanlıklarınızı bilmek değerlendirmeye yardımcı olur.', q: [
    { t: 'single', k: 'diyet', l: 'Beslenme düzeniniz', o: ['Karma, kısıtlama yok', 'Vejetaryen', 'Vegan', 'Düşük karbonhidrat / ketojenik', 'Aralıklı oruç', 'Diğer'] },
    { t: 'single', k: 'ogun', l: 'Günde kaç öğün yiyorsunuz?', o: ['1–2', '3', '4', '5 ve üzeri'] },
    { t: 'single', k: 'kisitla', l: 'Kilo ya da performans için bilerek yemeyi kısıtladığınız dönemler oluyor mu?', o: ['Hayır', 'Bazen', 'Sık sık'], neg: true },
    { t: 'single', k: 'kilodeg', l: 'Son 3 ayda kilonuz değişti mi?', o: ['Değişmedi (±2 kg)', '3 kg ve üzeri verdim', '3 kg ve üzeri aldım'] },
    { t: 'num', k: 'boy', l: 'Boyunuz', unit: 'cm', min: 120, max: 230 },

  ] },

];
const SECID = Object.fromEntries(SECTIONS.map((s) => [s.id, s]));
const FLOW = ['intro', 'kim', ...SECTIONS.map((s) => s.id), 'review', 'out'];

function sportsOf(a) { return [a.spor, ...((Array.isArray(a.spordiger) ? a.spordiger : []).filter((x) => x !== 'Yok'))].filter(Boolean); }

/* ------------------------------ durum ------------------------------ */
const store = { get() { try { return JSON.parse(sessionStorage.getItem('rk_on') || 'null'); } catch (e) { return null; } }, set(o) { try { sessionStorage.setItem('rk_on', JSON.stringify(o)); } catch (e) { } }, clear() { try { sessionStorage.removeItem('rk_on'); } catch (e) { } } };
let S = store.get() || { step: 0, ans: {}, pick: {}, consent: false, kim: { dosya: '', by: '', sex: '' } };
let OUT = null; /* üretilen şifreli dosya bilgisi */
let KEY = null; /* kliniğin genel anahtarı */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const save = () => store.set(S);

const b64 = (buf) => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const unb64url = (s) => unb64(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
const enc = new TextEncoder();

/* ------------------------------ şifreleme ------------------------------ */
async function loadClinicKey() {
  const m = /[#&]k=([A-Za-z0-9_-]+)/.exec(location.hash || '');
  if (!m) return null;
  try {
    const raw = unb64url(m[1]); if (raw.length !== 65 || raw[0] !== 4) return null;
    const pub = await crypto.subtle.importKey('raw', raw, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    const kid = b64(new Uint8Array(await crypto.subtle.digest('SHA-256', raw)).slice(0, 6));
    return { pub, kid };
  } catch (e) { return null; }
}
async function sealFor(key, obj) {
  const eph = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: key.pub }, eph.privateKey, 256);
  const hk = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const aes = await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt, info: enc.encode('RANKARA-onanket-v1') }, hk, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode(key.kid) }, aes, enc.encode(JSON.stringify(obj)));
  return { app: 'RANKARA-ONANKET', v: 1, kid: key.kid, epk: b64(await crypto.subtle.exportKey('raw', eph.publicKey)), salt: b64(salt), iv: b64(iv), ct: b64(ct) };
}

/* ------------------------------ yardımcılar ------------------------------ */
const isNone = (q, v) => q.none && v === q.none;
function answered(q, a) {
  const v = a[q.k];
  if (q.t === 'yn') return v && Object.values(v).some((x) => x === 'e' || x === 'h' || x === 'b');
  if (q.t === 'likert') return v && Object.values(v).some((x) => typeof x === 'number');
  if (q.t === 'multi') return Array.isArray(v) && v.length > 0;
  return v !== undefined && v !== null && v !== '';
}
const visibleQs = (sec, a) => sec.q.filter((q) => !q.when || q.when(a));
function valText(q, v) {
  if (v === NEG) return NEG;
  if (q.t === 'multi') return v.join(', ');
  if (q.t === 'yn') return q.items.filter(([k]) => v[k]).map(([k, l]) => `${l}: ${v[k] === 'e' ? 'Evet' : v[k] === 'h' ? 'Hayır' : 'Emin değilim'}`).join(' | ');
  if (q.t === 'likert') return q.items.filter(([k]) => typeof v[k] === 'number').map(([k, l]) => `${l} ${v[k]}`).join(', ');
  if (q.t === 'num') return v + ' ' + (q.unit || '');
  return String(v);
}
function secDone(id) { return S.pick[id] === 'fill'; }

/* hasta yanıtlarını iPad'in anlayacağı alanlara çevirir */
function buildPayload() {
  const a = S.ans, A = {}, lines = [], skipped = [], skippedQ = [];
  const kim = { dosya: normDosya(S.kim.dosya), by: +S.kim.by, sex: S.kim.sex };
  for (const sec of SECTIONS) {
    if (!secDone(sec.id)) { skipped.push(sec.ad); continue; }
    for (const q of visibleQs(sec, a)) {
      const v = a[q.k];
      if (!answered(q, a)) { skippedQ.push(q.l); continue; }
      lines.push({ s: sec.ad, l: q.t === 'yn' ? q.l : q.l, v: valText(q, v) });
      if (v === NEG) continue;
      if (q.t === 'yn') {
        const o = {}; for (const [k] of q.items) if (v[k] === 'e') o[k] = true; else if (v[k] === 'h') o[k] = false;
        if (q.k === 'ek1') A.ek1 = { ...(A.ek1 || {}), ...o }; else A['ek_' + q.k] = o;
      } else if (q.t === 'likert') {
        const o = {}; for (const [k] of q.items) if (typeof v[k] === 'number') o[k] = v[k]; A[q.k] = o;
      } else if (q.t === 'num') A[q.k] = +v;
      else A[q.k] = v;
    }
  }
  /* aile → EK-1 12, 13, 14 */
  const fam = a.aile;
  if (secDone('oz') && Array.isArray(fam) && fam.length && !fam.includes('Bilmiyorum') && fam[0] !== NEG) {
    A.ek1 = A.ek1 || {};
    A.ek1.s12 = fam.includes('<35 yaş ani ölüm'); A.ek1.s13 = fam.some((x) => FAM_HER.includes(x)); A.ek1.s14 = fam.includes('<35 yaş pil / ICD');
  }
  if (A.aile) { A.aile = A.aile.filter((x) => x !== 'Bilmiyorum'); if (!A.aile.length) delete A.aile; }
  return { app: 'RANKARA-ONANKET', v: 1, ts: new Date().toISOString(), kim, a: A, lines, skippedSections: skipped, skippedQuestions: skippedQ, surveyVersion: VERSION };
}

function qHTML(q) {
  const v = S.ans[q.k]; const neg = v === NEG; let body = '';
  const negChip = q.neg ? `<button class="chip atla" data-a="neg" data-k="${q.k}" aria-pressed="${neg}">${NEG}</button>` : '';
  if (q.t === 'single') body = `<div class="chips">${q.o.map((o) => `<button class="chip" data-a="single" data-k="${q.k}" data-v="${esc(o)}" aria-pressed="${v === o}">${esc(o)}</button>`).join('')}${negChip}</div>`;
  else if (q.t === 'multi') { const arr = Array.isArray(v) ? v : []; const all = [...q.o, ...(q.none ? [q.none] : []), ...(q.extra ? [q.extra] : [])];
    body = `<div class="chips">${all.map((o) => `<button class="chip" data-a="multi" data-k="${q.k}" data-v="${esc(o)}" aria-pressed="${arr.includes(o)}">${esc(o)}</button>`).join('')}${negChip}</div>`; }
  else if (q.t === 'yn') { const o = (v && typeof v === 'object') ? v : {};
    body = `<div class="yn">${q.items.map(([k, l]) => `<div class="it"><p class="t">${esc(l)}</p><div class="chips">${[['e', 'Evet'], ['h', 'Hayır'], ['b', 'Emin değilim']].map(([c, t]) => `<button class="chip" data-a="yn" data-k="${q.k}" data-i="${k}" data-v="${c}" aria-pressed="${o[k] === c}">${t}</button>`).join('')}</div></div>`).join('')}</div>`; }
  else if (q.t === 'likert') { const o = (v && typeof v === 'object') ? v : {};
    body = `<div class="lk">${q.items.map(([k, l, lo, hi]) => `<div class="it"><p class="t">${esc(l)}</p><div class="row7">${[1, 2, 3, 4, 5, 6, 7].map((n) => `<button class="chip" data-a="lk" data-k="${q.k}" data-i="${k}" data-v="${n}" aria-pressed="${o[k] === n}">${n}</button>`).join('')}</div><div class="ends"><span>${esc(lo)}</span><span>${esc(hi)}</span></div></div>`).join('')}</div>`; }

function vError(m) { return `${hdrBar()}<h1>Bağlantı eksik</h1><div class="alert bad">${esc(m)}</div><p class="muted">Lütfen kliniğin size gönderdiği bağlantının tamamını açın. Sorun sürerse randevuda anketi yüz yüze yapabiliriz.</p>`; }

/* ------------------------------ çizim ------------------------------ */
function validKim() { const d = normDosya(S.kim.dosya); return !!d && !!S.kim.by && !!S.kim.sex; }
function normDosya(x) { const m = /^\s*([A-Za-z]{2})\s*-?\s*(\d{1,4})\s*$/.exec(x || ''); return m ? m[1].toUpperCase() + '-' + m[2].padStart(4, '0') : null; }
function render() {
  const nav = $('#nav'), nin = $('#navin'); let html = '', navHTML = ''; S.cur = S.cur || FLOW[S.step || 0];
  const cur = S.cur;
  if (!KEY) { $('#app').innerHTML = vError('Bu bağlantıda kliniğin şifreleme anahtarı yok ya da bozuk.'); nav.hidden = true; return; }
  if (cur === 'intro') { html = vIntro(); navHTML = `<button class="btn pri" data-a="next" ${S.consent ? '' : 'disabled'}>Başla</button>`; }
  else if (cur === 'kim') { html = vKim(); navHTML = `<button class="btn" data-a="prev">‹ Geri</button><button class="btn pri" data-a="next" ${validKim() ? '' : 'disabled'}>Devam</button>`; }
  else if (cur === 'review') { html = vReview(); navHTML = `<button class="btn" data-a="prev">‹ Geri</button><button class="btn org" data-a="make">Dosyayı oluştur</button>`; }
  else if (cur === 'out') { html = vOut(); navHTML = ''; }
  else { const sec = SECID[cur]; html = vSec(sec); navHTML = `<button class="btn" data-a="prev">‹ Geri</button><button class="btn pri" data-a="next">${S.pick[cur] ? 'Devam' : 'Atla'}</button>`; }
  const y = window.scrollY; $('#app').innerHTML = html; nin.innerHTML = navHTML; nav.hidden = !navHTML;
  if (S.keepScroll) { window.scrollTo(0, y); S.keepScroll = false; } else window.scrollTo(0, 0);
}
function go(id) { S.cur = id; S.step = FLOW.indexOf(id); save(); render(); }
const toast = (m) => { const t = document.createElement('div'); t.textContent = m; t.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#13263A;color:#fff;padding:12px 18px;border-radius:12px;z-index:9;font-size:16px'; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };

function plainText() { const P = OUT ? OUT.payload : buildPayload(); const g = {}; P.lines.forEach((x) => (g[x.s] = g[x.s] || []).push(x)); return `Spor Kardiyolojisi Ön Değerlendirme Anketi\nDosya: ${P.kim.dosya}\n\n` + Object.entries(g).map(([s, ls]) => s + '\n' + ls.map((x) => `- ${x.l}: ${x.v}`).join('\n')).join('\n\n') + (P.skippedSections.length ? '\n\nRandevuya bırakılan bölümler: ' + P.skippedSections.join(', ') : ''); }

/* ------------------------------ olaylar ------------------------------ */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled || b.tagName === 'INPUT' || b.tagName === 'TEXTAREA') return;
  const a = b.dataset.a, k = b.dataset.k, v = b.dataset.v, A = S.ans;
  const q = k ? SECTIONS.flatMap((s) => s.q).find((x) => x.k === k) : null;
  S.keepScroll = true;
  switch (a) {
    case 'next': { const i = FLOW.indexOf(S.cur); go(FLOW[Math.min(i + 1, FLOW.length - 1)]); return; }
    case 'prev': { const i = FLOW.indexOf(S.cur); go(FLOW[Math.max(i - 1, 0)]); return; }
    case 'goto': go(v); return;
    case 'sex': S.kim.sex = v; break;
    case 'pick': S.pick[b.dataset.id] = v; break;
    case 'single': A[k] = A[k] === v ? undefined : v; break;
    case 'neg': A[k] = A[k] === NEG ? undefined : NEG; break;
    case 'multi': { let arr = Array.isArray(A[k]) ? [...A[k]] : []; if (A[k] === NEG) arr = [];
      if (arr.includes(v)) arr = arr.filter((x) => x !== v);
      else if (v === q.none || v === q.extra) arr = [v];
      else arr = [...arr.filter((x) => x !== q.none && x !== q.extra), v];
      A[k] = arr.length ? arr : undefined; break; }
    case 'yn': { const o = { ...(A[k] && typeof A[k] === 'object' ? A[k] : {}) }; const i = b.dataset.i; o[i] = o[i] === v ? undefined : v; A[k] = o; break; }
    case 'lk': { const o = { ...(A[k] && typeof A[k] === 'object' ? A[k] : {}) }; const i = b.dataset.i, n = +v; o[i] = o[i] === n ? undefined : n; A[k] = o; break; }
    case 'make': {
      try { const P = buildPayload(); const box = await sealFor(KEY, P); const text = JSON.stringify(box);
        OUT = { payload: P, text, name: `RANKARA-onanket-${Array.from(crypto.getRandomValues(new Uint8Array(3)), (x) => x.toString(16).padStart(2, '0')).join('')}.json` }; store.clear(); S.cur = 'out'; render();
      } catch (err) { toast('Şifreleme yapılamadı. Tarayıcınızı güncelleyip yeniden deneyin.'); } return; }
    case 'share': { const f = new File([OUT.text], OUT.name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], title: 'RANKARA ön anket' }); } catch (err) { if (!err || err.name !== 'AbortError') toast('Paylaşılamadı; “Telefona kaydet”i deneyin'); } }
      else toast('Bu telefon dosya paylaşımını desteklemiyor; “Telefona kaydet”i kullanın');
      return; }
    case 'dl': { const bl = new Blob([OUT.text], { type: 'application/json' }); const u = URL.createObjectURL(bl); const an = document.createElement('a'); an.href = u; an.download = OUT.name; document.body.appendChild(an); an.click(); setTimeout(() => { URL.revokeObjectURL(u); an.remove(); }, 4000); toast('Dosya kaydedildi'); return; }
    case 'copy': try { await navigator.clipboard.writeText(OUT.text); toast('Şifreli kod kopyalandı'); } catch (err) { toast('Kopyalanamadı'); } return;
    case 'copytxt': try { await navigator.clipboard.writeText(plainText()); toast('Cevaplarınız kopyalandı'); } catch (err) { toast('Kopyalanamadı'); } return;
    case 'wipe': store.clear(); S = { step: 0, ans: {}, pick: {}, consent: false, kim: { dosya: '', by: '', sex: '' } }; toast('Telefondaki taslak silindi'); return;
  }
  save(); render();
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'consent') { S.consent = t.checked; save(); S.keepScroll = true; render(); return; }
  if (t.id === 'by') { S.kim.by = t.value; save(); S.keepScroll = true; render(); return; }
  if (t.id === 'dosya') { S.kim.dosya = t.value; save(); S.keepScroll = true; render(); return; }
});
document.addEventListener('input', (e) => {
  const t = e.target; const k = t.dataset && t.dataset.k; if (!k) return;
  const q = SECTIONS.flatMap((s) => s.q).find((x) => x.k === k);
  if (t.dataset.a === 'text') S.ans[k] = t.value.slice(0, 300) || undefined;
  else if (t.dataset.a === 'num') { const n = parseFloat(String(t.value).replace(',', '.')); S.ans[k] = (isFinite(n) && n >= q.min && n <= q.max) ? n : undefined; }
  save();
});
document.addEventListener('input', (e) => { if (e.target.id === 'dosya') { S.kim.dosya = e.target.value; save(); const nb = document.querySelector('#navin .pri'); if (nb) nb.disabled = !validKim(); } });

(async function boot() {
  KEY = await loadClinicKey();
  if (S.cur && !FLOW.includes(S.cur)) S.cur = 'intro';
  if (S.cur === 'out') S.cur = 'review';
  render();
})();
</script>
